name: Build, Push, and Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
  ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY || secrets.ECR_BACKEND_REPOSITORY || 'traffic-data-backend' }}
  ECR_FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY || secrets.ECR_FRONTEND_REPOSITORY || 'traffic-data-frontend' }}
  EC2_HOST: ${{ vars.EC2_HOST || secrets.EC2_HOST }}
  EC2_USER: ${{ vars.EC2_USER || secrets.EC2_USER || 'ec2-user' }}
  FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN || secrets.FRONTEND_ORIGIN || 'http://localhost' }}

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js for backend
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Test backend
        working-directory: backend
        run: |
          npm ci
          npm test

      - name: Set up Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  build-push-deploy:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME || secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repositories exist
        run: |
          aws ecr describe-repositories --repository-names "$ECR_BACKEND_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_BACKEND_REPOSITORY" >/dev/null
          aws ecr describe-repositories --repository-names "$ECR_FRONTEND_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "$ECR_FRONTEND_REPOSITORY" >/dev/null

      - name: Build and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f backend/Dockerfile \
            -t "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest" \
            .
          docker push "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest"

      - name: Build and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=/api \
            -t "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest" \
            ./frontend
          docker push "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest"

      - name: Validate deploy configuration
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "::error::EC2_HOST variable or secret is required (public DNS or IP only, not a URL)."
            exit 1
          fi

          if [ -z "$EC2_SSH_PRIVATE_KEY" ]; then
            echo "::error::EC2_SSH_PRIVATE_KEY secret is required."
            exit 1
          fi

          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "::error::POSTGRES_PASSWORD secret is required."
            exit 1
          fi

          EC2_HOST="${EC2_HOST#http://}"
          EC2_HOST="${EC2_HOST#https://}"
          EC2_HOST="${EC2_HOST%%/*}"
          echo "EC2_HOST=$EC2_HOST" >> "$GITHUB_ENV"

          if ! printf '%s' "$EC2_SSH_PRIVATE_KEY" | tr -d '\r' | grep -q 'BEGIN.*PRIVATE KEY'; then
            echo "::error::EC2_SSH_PRIVATE_KEY must be the full .pem file including BEGIN/END lines."
            exit 1
          fi

      - name: Check SSH port is reachable
        run: |
          if ! timeout 15 bash -c "echo > /dev/tcp/${EC2_HOST}/22" 2>/dev/null; then
            echo "::error::Cannot reach ${EC2_HOST}:22. In the EC2 security group, allow inbound SSH (port 22) from GitHub Actions (see https://api.github.com/meta) or temporarily from 0.0.0.0/0."
            exit 1
          fi
          echo "SSH port 22 is reachable on ${EC2_HOST}"

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Add EC2 host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "echo 'SSH OK' && command -v docker && command -v aws"

      - name: Copy deploy assets to EC2
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "sudo mkdir -p /opt/traffic-data/data && sudo chown -R $EC2_USER:$EC2_USER /opt/traffic-data"

          scp -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=yes \
            deploy/ec2-deploy.sh \
            "$EC2_USER@$EC2_HOST:/opt/traffic-data/ec2-deploy.sh"

          scp -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=yes \
            "road_tf_veh_linear_2_0 2 _ cleaned.csv" \
            "$EC2_USER@$EC2_HOST:/opt/traffic-data/data/"

          ssh -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" \
            "sed -i 's/\r$//' /opt/traffic-data/ec2-deploy.sh && chmod +x /opt/traffic-data/ec2-deploy.sh"

      - name: Run deploy on EC2
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          POSTGRES_PASSWORD_B64="$(printf '%s' "$POSTGRES_PASSWORD" | base64 -w 0)"
          DEPLOY_ENV="AWS_REGION='$AWS_REGION' \
            ECR_REGISTRY='$ECR_REGISTRY' \
            ECR_BACKEND_REPOSITORY='$ECR_BACKEND_REPOSITORY' \
            ECR_FRONTEND_REPOSITORY='$ECR_FRONTEND_REPOSITORY' \
            IMAGE_TAG='$IMAGE_TAG' \
            FRONTEND_ORIGIN='$FRONTEND_ORIGIN' \
            POSTGRES_PASSWORD=\$(printf '%s' '$POSTGRES_PASSWORD_B64' | base64 -d)"

          SSH_OPTS="-o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=yes"

          if ssh $SSH_OPTS "$EC2_USER@$EC2_HOST" "aws sts get-caller-identity >/dev/null 2>&1"; then
            echo "Using EC2 instance role for ECR pull"
            ssh $SSH_OPTS "$EC2_USER@$EC2_HOST" \
              "$DEPLOY_ENV SKIP_ECR_LOGIN=0 /opt/traffic-data/ec2-deploy.sh"
          else
            echo "EC2 has no IAM credentials; using GitHub Actions role for ECR pull"
            ECR_PASSWORD="$(aws ecr get-login-password --region "$AWS_REGION")"
            ECR_PASSWORD_B64="$(printf '%s' "$ECR_PASSWORD" | base64 -w 0)"
            ssh $SSH_OPTS "$EC2_USER@$EC2_HOST" \
              "printf '%s' '$ECR_PASSWORD_B64' | base64 -d | docker login --username AWS --password-stdin '$ECR_REGISTRY'"
            ssh $SSH_OPTS "$EC2_USER@$EC2_HOST" \
              "$DEPLOY_ENV SKIP_ECR_LOGIN=1 /opt/traffic-data/ec2-deploy.sh"
          fi
